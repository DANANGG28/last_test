services:
  postgres:
    image: postgres:16-alpine
    container_name: last_test_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: last_test
      POSTGRES_USER: last_test_user
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U last_test_user -d last_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: last_test_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: last_test_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
